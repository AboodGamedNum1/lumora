plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.lumora.app'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.lumora.app'
        minSdk 29            // Android 10, the plan's floor (D10)
        targetSdk 35
        versionCode 1
        versionName '0.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++23'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildFeatures { buildConfig true }

    // The packed sample scene (samples/aurora.lumora) is an asset of the instrumented tests only.
    sourceSets { androidTest { assets.srcDirs = ['../../samples'] } }

    // Two distribution flavors from day one (docs/lua-api.md, Build flavors). They differ only in
    // the DISTRIBUTION constant for now; permission-bearing features arrive in M6 and M8.
    flavorDimensions 'distribution'
    productFlavors {
        play { dimension 'distribution'; buildConfigField 'String', 'DISTRIBUTION', '"play"' }
        full { dimension 'distribution'; buildConfigField 'String', 'DISTRIBUTION', '"full"' }
    }

    buildTypes {
        release {
            // Only arm64-v8a ships (D25). x86_64 exists in debug builds for the emulator only.
            ndk { abiFilters 'arm64-v8a' }
            minifyEnabled false
        }
        debug {
            ndk { abiFilters 'arm64-v8a', 'x86_64' }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
