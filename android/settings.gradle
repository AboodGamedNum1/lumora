pluginManagement {
    repositories {
        google()
        // Google's mirror of Maven Central first: the origin rate-limits (HTTP 429) shared CI runners.
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        // Google's mirror of Maven Central first: the origin rate-limits (HTTP 429) shared CI runners.
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        mavenCentral()
    }
}
rootProject.name = "lumora-android"
include ':app'
