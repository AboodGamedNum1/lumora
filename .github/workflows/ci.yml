name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Documentation consistency check
        run: python3 tools/check_docs.py
      - name: PROJECT_STATE matches the newest milestone tag
        run: python3 tools/ci/check_state_tag.py
      - name: Secret scan
        run: python3 tools/ci/secret_scan.py
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxext-dev libxtst-dev libxfixes-dev libxrender-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev \
            libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri libgl-dev libdrm-dev libgbm-dev libasound2-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools
      - name: Record toolchain versions
        run: |
          cmake --version | head -1; ninja --version; g++ --version | head -1; python3 --version
      - name: Build and test (ASan and UBSan)
        run: python3 tools/ci/test.py --sanitize
        env:
          SDL_VIDEODRIVER: dummy
          # Leak detection is off: the software Vulkan driver (llvmpipe) leaves small allocations in
          # unsymbolized third-party modules, with no Lumora frame. ASan memory-error checks and UBSan stay on.
          ASAN_OPTIONS: detect_leaks=0
      - name: Upload golden images and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-golden-and-logs
          path: |
            build/golden-out
            build/Testing
            build/tests/shaders/*.h
          if-no-files-found: ignore
          retention-days: 7
  windows-vulkan-spike:
    # Spike: software Vulkan (Mesa lavapipe) on the Windows runner. Does not gate the main CI result.
    runs-on: windows-2025
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify the pinned lavapipe ICD
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/26.3.1/mesa3d-26.3.1-release-msvc.7z" -OutFile mesa.7z
          $h = (Get-FileHash mesa.7z -Algorithm SHA256).Hash
          if ($h -ne "64E84CF13D67DD354640BF443ED0445E6A83AFD06A5729F0750B3744D633B3F1") { throw "mesa archive hash mismatch: $h" }
          7z x mesa.7z -omesa -y | Select-Object -Last 2
      - name: Build and run the Vulkan tests on lavapipe
        shell: pwsh
        run: |
          cmake -S . -B build-vk -DLUMORA_BUILD_EDITOR=OFF -DLUMORA_WIN_VULKAN_SPIKE=ON "-DLUMORA_PRECOMPILED_SPV_DIR=$PWD/tests/shaders/precompiled"
          cmake --build build-vk --config Release --parallel
          $env:VK_DRIVER_FILES = "$PWD\mesa\x64\lvp_icd.x86_64.json"
          # The loader ignores environment overrides in an elevated process (the runner is admin),
          # so the ICD manifest is registered in the Khronos registry key instead.
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Name $env:VK_DRIVER_FILES -PropertyType DWord -Value 0 -Force | Out-Null
          $env:VK_LOADER_DEBUG = "error,warn,driver"
          Test-Path $env:VK_DRIVER_FILES
          Get-Content $env:VK_DRIVER_FILES
          $env:LUMORA_ALLOW_NO_VALIDATION = "1"
          & build-vk/tests/Release/lumora_tests.exe
      - name: Upload golden output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-vulkan-golden
          path: build-vk/golden-out
          if-no-files-found: ignore
          retention-days: 7
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record toolchain versions
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1
          ninja --version
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Select-Object -ExpandProperty Name
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion
      - name: Build and test (editor smoke test, no GPU)
        shell: pwsh
        run: python tools/ci/test.py
      - name: WARP D3D12 spike (result is recorded, a failure does not fail the job)
        shell: pwsh
        continue-on-error: true
        run: build/spikes/Release/warp_spike.exe
      - name: Software Vulkan on Windows spike (probe only, result is recorded)
        shell: pwsh
        continue-on-error: true
        run: |
          "VULKAN_SDK=$env:VULKAN_SDK"
          Get-ChildItem "$env:windir\System32\vulkan-1.dll" -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Get-ChildItem "C:\VulkanSDK" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Get-ChildItem "C:\Windows\System32\DriverStore\FileRepository" -Filter "*vulkan*" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 FullName
          Get-Command vulkaninfo -ErrorAction SilentlyContinue | Select-Object Source
          Get-Command glslangValidator -ErrorAction SilentlyContinue | Select-Object Source
      - name: Software Vulkan driver download probe (result is recorded)
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/26.3.1/mesa3d-26.3.1-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          "sha256: " + (Get-FileHash mesa.7z -Algorithm SHA256).Hash
          7z x mesa.7z -omesa -y | Select-Object -Last 3
          Get-ChildItem mesa -Recurse -Include "*lvp*","*vulkan*" | Select-Object FullName, Length
          Get-ChildItem mesa -Recurse -Filter "*icd*.json" | ForEach-Object { $_.FullName; Get-Content $_.FullName }
      - name: Upload golden images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-golden
          path: build/golden-out
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload editor zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumora-editor-windows-smoke
          path: build/editor/Release/lumora_editor.exe
          retention-days: 3
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Install pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          java -version
      - name: Build release APK and debug APK
        working-directory: android
        # Maven Central rate-limits hosted runners now and then (HTTP 429), so retry the download.
        run: |
          for i in 1 2 3; do ./gradlew --no-daemon assembleRelease assembleDebug && exit 0; sleep 30; done; exit 1
      - name: Check ABI set and 16 KB alignment
        run: python3 tools/ci/check_apk.py android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-logs
          path: android/app/build/reports
          retention-days: 7
  android-emulator:
    # Answers the M0 question "does KVM work on the hosted runner": the job fails loudly if not.
    # Lanes 34 and 36 are new in M2 and do not gate until they have passed once on main.
    name: android-emulator (api ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: ${{ matrix.api != 29 }}
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Install pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Pre-fetch Gradle dependencies and build test APKs (retried, Maven Central rate limits)
        working-directory: android
        run: |
          for i in 1 2 3 4; do ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest && exit 0; sleep 60; done; exit 1
      - name: Instrumented test on emulator (x86_64, software graphics, test-only ABI)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest || ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-reports-${{ matrix.api }}
          path: android/app/build/reports
          retention-days: 7
